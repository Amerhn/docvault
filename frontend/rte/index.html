<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:transparent}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tinymce/6.8.3/tinymce.min.js" referrerpolicy="origin"></script>
</head>
<body>
<textarea id="ed"></textarea>
<script>
function send(type, data) {
  window.parent.postMessage(Object.assign({isStreamlitMessage: true, type: type}, data), "*");
}
var started = false, timer = null;

var baseline = null;
function report(editor) {
  clearTimeout(timer);
  timer = setTimeout(function () {
    var now = editor.getContent();
    if (baseline === null || now === baseline) return;       // nothing really changed
    send("streamlit:setComponentValue", {value: now, dataType: "json"});
  }, 700);
}

function start(args) {
  if (started) return;
  started = true;
  var h = args.height || 640;
  document.getElementById("ed").value = args.html || "";
  var page = "html{background:#e4e6ea}" +
    "body{background:#fff;max-width:794px;min-height:1000px;margin:24px auto;padding:72px 80px;" +
    "box-shadow:0 1px 6px rgba(0,0,0,.25);font-family:Calibri,Arial,sans-serif;font-size:11pt;line-height:1.5}" +
    "table{border-collapse:collapse}td,th{border:1px solid #999;padding:4px 8px}img{max-width:100%}";
  tinymce.init({
    selector: "#ed",
    height: h,
    base_url: "https://cdnjs.cloudflare.com/ajax/libs/tinymce/6.8.3",
    suffix: ".min",
    promotion: false,
    branding: false,
    menubar: "file edit view insert format table",
    plugins: "lists table image link code searchreplace wordcount charmap pagebreak",
    toolbar: "undo redo | blocks fontfamily fontsize | bold italic underline strikethrough | forecolor backcolor | " +
             "alignleft aligncenter alignright alignjustify | bullist numlist outdent indent | table image link | removeformat",
    content_style: page,
    automatic_uploads: false,
    paste_data_images: true,
    setup: function (ed) {
      ed.on("init", function () {
        baseline = ed.getContent();
        send("streamlit:setFrameHeight", {height: h + 4});
      });
      ed.on("input change undo redo keyup", function () { report(ed); });
    }
  });
}

window.addEventListener("message", function (e) {
  if (e.data && e.data.type === "streamlit:render") start(e.data.args);
});
send("streamlit:componentReady", {apiVersion: 1});
</script>
</body>
</html>
